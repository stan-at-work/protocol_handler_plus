  protocol_handler_plus_platform_interface: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  
flutter:
  plugin:
    implements: protocol_handler_plus
    platforms:
      macos:
        pluginClass: ProtocolHandlerPlusPlusMacosPlugin
